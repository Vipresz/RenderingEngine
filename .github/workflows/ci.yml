name: RenderingEngine CI

on:
  push:
    branches: [main, master, rgrigorii/menu]
  pull_request:
    branches: [main, master, rgrigorii/menu]

concurrency:
  group: rendering-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBUILD_ENGINE_EXAMPLES=OFF -DBUILD_ENGINE_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_ENGINE_EXAMPLES=OFF -DBUILD_ENGINE_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  coverage-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y

      - name: Configure
        run: cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DBUILD_ENGINE_EXAMPLES=OFF -DBUILD_ENGINE_TESTS=ON

      - name: Build
        run: cmake --build build-cov --config Debug --target EngineTests

      - name: Coverage gate (60%)
        shell: pwsh
        run: |
          $occ = "${env:ProgramFiles}\OpenCppCoverage\OpenCppCoverage.exe"
          if (-not (Test-Path $occ)) {
            $occ = "${env:ProgramFiles(x86)}\OpenCppCoverage\OpenCppCoverage.exe"
          }
          ./scripts/check_coverage.ps1 -BuildDir build-cov -Config Debug -MinCoverage 0.60 -OpenCppCoverage $occ
