name: RenderingEngine CI

# Essential engine CI for this repo. AstralWorlds does not re-run these tests;
# it only builds game/server (see AstralWorlds .github/workflows/ci.yml + cd.yml).
# test-windows and test-linux run the core suite. test-platform-windows runs
# only tests labeled platform (OpenGL, Nuklear, and TLS-on cases). coverage-windows
# executes the core suite again because the coverage gate needs that run.

on:
  push:
    branches: [main, master, rgrigorii/menu, feat/concurrent-player-scale]
  pull_request:
    branches: [main, master, rgrigorii/menu, feat/concurrent-player-scale]
  workflow_dispatch:

concurrency:
  group: rendering-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    # Vipresz org runner on this PC (DESKTOP-HF590QG-vipresz). It has a GPU;
    # GitHub-hosted windows-latest does not.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBUILD_ENGINE_EXAMPLES=OFF -DBUILD_ENGINE_TESTS=ON -DBUILD_ENGINE_PLATFORM=OFF

      - name: Build
        run: cmake --build build --config Release --target EngineTests --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --label-exclude aggregate

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_ENGINE_EXAMPLES=OFF -DBUILD_ENGINE_TESTS=ON -DBUILD_ENGINE_PLATFORM=OFF

      - name: Build
        run: cmake --build build --target EngineTests --parallel

      - name: Test
        # Sequential: parallel gtest discovery + net integration tests can deadlock on Linux.
        run: ctest --test-dir build --output-on-failure -j 1 --label-exclude aggregate

  test-platform-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Platform + TLS + Nuklear
        run: >
          cmake -B build-platform
          -DBUILD_ENGINE_EXAMPLES=OFF
          -DBUILD_ENGINE_TESTS=ON
          -DBUILD_ENGINE_PLATFORM=ON
          -DENGINE_ENABLE_TLS=ON
          -DENGINE_ENABLE_AUDIO=ON
          -DNUKLEAR_DIR=${{ github.workspace }}/third_party/nuklear

      - name: Build
        run: cmake --build build-platform --config Release --target EngineTests --parallel

      - name: Test
        # Core suites already ran in test-windows. -L platform keeps OpenGL, Nuklear, and TLS-on cases.
        run: ctest --test-dir build-platform -C Release --output-on-failure -L platform --label-exclude aggregate --no-tests=error

  coverage-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCppCoverage
        shell: powershell
        run: |
          $dest = Join-Path $env:TEMP "OpenCppCoverageSetup.exe"
          $url = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
              $downloaded = $true
              break
            } catch {
              Write-Host "Download attempt $attempt failed: $_"
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $downloaded) {
            throw "Failed to download OpenCppCoverage from $url"
          }
          $proc = Start-Process -FilePath $dest -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "OpenCppCoverage installer exited with $($proc.ExitCode)"
          }

      - name: Configure
        run: cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DBUILD_ENGINE_EXAMPLES=OFF -DBUILD_ENGINE_TESTS=ON -DBUILD_ENGINE_PLATFORM=OFF

      - name: Build
        run: cmake --build build-cov --config Debug --target EngineTests

      - name: Coverage gate (60%)
        shell: powershell
        run: |
          $occ = "${env:ProgramFiles}\OpenCppCoverage\OpenCppCoverage.exe"
          if (-not (Test-Path $occ)) {
            $occ = "${env:ProgramFiles(x86)}\OpenCppCoverage\OpenCppCoverage.exe"
          }
          ./scripts/check_coverage.ps1 -BuildDir build-cov -Config Debug -MinCoverage 0.60 -OpenCppCoverage $occ
